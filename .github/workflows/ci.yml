name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -e '.[dev]'
      - name: Gate (ruff, tests, review tests, script syntax)
        run: scripts/gate.sh
